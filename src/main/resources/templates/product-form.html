<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thông Tin Sản Phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 500px; border-radius: 12px;">
        <h4 class="card-title text-center text-primary mb-4 fw-bold">THÔNG TIN SẢN PHẨM</h4>

        <form action="/products/save" method="post" th:object="${product}">
            <input type="hidden" id="prod-id" th:field="*{id}" />
            <div class="mb-3">
                <label class="form-label fw-semibold">Tên sản phẩm:</label>
                <input type="text" class="form-control" id="prod-name" th:field="*{name}" placeholder="Ví dụ: Bàn phím cơ" required />
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Giá:</label>
                <input type="number" step="0.01" class="form-control" id="prod-price" th:field="*{price}" placeholder="Ví dụ: 250000" required />
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Số lượng:</label>
                <input type="number" class="form-control" id="prod-quantity" th:field="*{quantity}" placeholder="Ví dụ: 50" required />
            </div>
            <div class="d-flex justify-content-between mt-4">
                <a href="/products" class="btn btn-secondary px-4">Quay Lại</a>
                <button type="submit" class="btn btn-success px-4" id="btn-save-product">Lưu Sản Phẩm</button>
            </div>
        </form>
    </div>
</body>
</html>
