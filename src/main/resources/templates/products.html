<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Danh Sách Sản Phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold">Hệ Thống Quản Lý Sản Phẩm</span>
            <div class="d-flex">
                <a id="btn-logout" class="btn btn-outline-light btn-sm" href="/logout">Đăng Xuất</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold text-secondary mb-0">Danh Sách Sản Phẩm</h4>
            <a id="btn-add-product" class="btn btn-primary" href="/products/new">+ Thêm Sản Phẩm Mới</a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0" id="product-table">
                        <thead class="table-primary">
                            <tr>
                                <th scope="col" style="width: 10%;">ID</th>
                                <th scope="col" style="width: 40%;">Tên Sản Phẩm</th>
                                <th scope="col" style="width: 20%;">Giá (VNĐ)</th>
                                <th scope="col" style="width: 15%;">Số Lượng</th>
                                <th scope="col" class="text-center" style="width: 15%;">Hành Động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="prod : ${products}">
                                <td class="fw-bold" th:text="${prod.id}">1</td>
                                <td class="prod-name" th:text="${prod.name}">Sản phẩm mẫu</td>
                                <td class="text-primary fw-semibold" th:text="${prod.price}">100000</td>
                                <td th:text="${prod.quantity}">10</td>
                                <td class="text-center">
                                    <a th:id="'edit-btn-' + ${prod.id}" class="btn btn-sm btn-outline-warning me-1" th:href="@{/products/edit/{id}(id=${prod.id})}">Sửa</a>
                                    <a th:id="'delete-btn-' + ${prod.id}" class="btn btn-sm btn-outline-danger" th:href="@{/products/delete/{id}(id=${prod.id})}" onclick="return confirm('Bạn có chắc chắn muốn xóa?')">Xóa</a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(products)}">
                                <td colspan="5" class="text-center py-4 text-muted">Chưa có sản phẩm nào. Hãy thêm mới!</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
