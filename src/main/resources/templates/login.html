<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng Nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px; border-radius: 12px;">
        <h3 class="card-title text-center text-primary mb-4 fw-bold">ĐĂNG NHẬP</h3>
        
        <div id="error-message" class="alert alert-danger py-2" th:if="${error}" th:text="${error}"></div>
        <div id="success-message" class="alert alert-success py-2" th:if="${success}" th:text="${success}"></div>

        <form action="/login" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">Tên đăng nhập:</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Nhập username" required />
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Mật khẩu:</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Nhập mật khẩu" required />
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="btn-login">Đăng Nhập</button>
        </form>
        
        <p class="text-center mt-3 mb-0 text-muted">
            Chưa có tài khoản? <a id="link-register" class="text-decoration-none fw-semibold" href="/register">Đăng ký ngay</a>
        </p>
    </div>
</body>
</html>
