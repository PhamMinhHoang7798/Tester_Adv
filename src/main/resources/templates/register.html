<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng Ký Tài Khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 420px; border-radius: 12px;">
        <h3 class="card-title text-center text-success mb-4 fw-bold">ĐĂNG KÝ TÀI KHOẢN</h3>

        <div id="error-message" class="alert alert-danger py-2" th:if="${error}" th:text="${error}"></div>

        <form action="/register" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">Họ và Tên:</label>
                <input type="text" class="form-control" id="fullName" name="fullName" placeholder="Nhập họ và tên" required />
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Tên đăng nhập:</label>
                <input type="text" class="form-control" id="reg-username" name="username" placeholder="Nhập tên đăng nhập" required />
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Mật khẩu:</label>
                <input type="password" class="form-control" id="reg-password" name="password" placeholder="Nhập mật khẩu" required />
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold" id="btn-register">Đăng Ký</button>
        </form>
        
        <p class="text-center mt-3 mb-0 text-muted">
            Đã có tài khoản? <a id="link-login" class="text-decoration-none fw-semibold" href="/login">Đăng nhập</a>
        </p>
    </div>
</body>
</html>
